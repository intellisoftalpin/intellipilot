# cargo-audit configuration (auto-loaded from .cargo/audit.toml).
# See ../audit.toml for the policy rationale.
#
# Policy: zero ignores. Any ignore MUST carry a written justification and an
# upstream fix tracker, and be reviewed at every dependency bump.

[advisories]
ignore = [
    # RUSTSEC-2023-0071 — `rsa` Marvin timing side-channel.
    # `rsa` is an UNUSED, OPTIONAL dependency of `ssh-key` (only behind
    # ssh-key's `rsa` feature, which we do NOT enable — ssh-key is used solely
    # for Ed25519 keygen/encoding). It is never compiled into any binary
    # (`cargo tree -i rsa --target all` is empty) and `cargo deny check`
    # (dependency-graph aware) passes clean; cargo-audit flags it only because
    # it scans Cargo.lock without feature resolution. No fixed rsa release
    # exists. Re-evaluate when ssh-key drops the optional dep or rsa ships a fix.
    # Upstream: https://github.com/RustCrypto/RSA/issues/19
    "RUSTSEC-2023-0071",
]
