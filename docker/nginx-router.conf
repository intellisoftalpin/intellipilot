server {
    listen 80 default_server;
    server_name _;

    # Match the backend's INTELLIPILOT_ATTACHMENT_MAX_BYTES (25 MiB default)
    # plus multipart overhead. Override by editing this file or mounting
    # your own at the same path.
    client_max_body_size 32m;

    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host  $host;

    # Backend HTTP API. Routes live under /api/v1 inside the container, so
    # pass the path through unchanged (no trailing slash on proxy_pass).
    location /api/ {
        proxy_pass http://api:8080;
    }

    # Operational endpoints exposed directly by the backend (not under /api).
    location /health/ {
        proxy_pass http://api:8080;
    }

    # Everything else → Flutter SPA. The frontend image is its own nginx
    # that handles try_files / index.html fallback internally.
    location / {
        proxy_pass http://frontend:80;
    }
}
