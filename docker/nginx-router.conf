server {
    listen 80 default_server;
    server_name _;

    # Match the backend's INTELLIPILOT_ATTACHMENT_MAX_BYTES (25 MiB default)
    # plus multipart overhead. Override by editing this file or mounting
    # your own at the same path.
    client_max_body_size 32m;

    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host  $host;

    # SSE change feed: frames must reach the client immediately, so response
    # buffering is off; the read timeout outlives the backend's own stream
    # cap (15 min) and its ~25s heartbeats. Regex locations outrank the
    # /api/ prefix below.
    location ~ ^/api/v1/projects/[^/]+/events$ {
        proxy_pass http://api:8080;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 20m;
    }

    # Meeting file uploads: recordings up to the backend's
    # INTELLIPILOT_MEETING_MEDIA_MAX_BYTES (2 GiB default) plus multipart
    # overhead. Request buffering is off so the body streams straight to the
    # backend (which spools it to disk itself) instead of being written to an
    # nginx temp file first; the timeouts allow a slow uplink.
    location ~ ^/api/v1/projects/[^/]+/meetings/[^/]+/artifacts$ {
        client_max_body_size 2100m;
        proxy_request_buffering off;
        client_body_timeout 1h;
        proxy_send_timeout 1h;
        proxy_read_timeout 1h;
        proxy_pass http://api:8080;
    }

    # File downloads stream from the backend (with byte ranges for media
    # seeking): don't buffer multi-gigabyte bodies to disk here.
    location ~ ^/api/v1/projects/[^/]+/attachments/[^/]+/download$ {
        proxy_buffering off;
        proxy_read_timeout 1h;
        proxy_pass http://api:8080;
    }

    # Backend HTTP API. Routes live under /api/v1 inside the container, so
    # pass the path through unchanged (no trailing slash on proxy_pass).
    location /api/ {
        proxy_pass http://api:8080;
    }

    # Operational endpoints exposed directly by the backend (not under /api).
    location /health/ {
        proxy_pass http://api:8080;
    }

    # Everything else → Flutter SPA. The frontend image is its own nginx
    # that handles try_files / index.html fallback internally.
    location / {
        proxy_pass http://frontend:80;
    }
}
