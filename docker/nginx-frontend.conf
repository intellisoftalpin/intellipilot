server {
    listen 80 default_server;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Disable directory listing.
    autoindex off;

    # Long cache for fingerprinted static assets.
    location ~* \.(?:js|mjs|css|woff2?|ttf|otf|eot|svg|png|jpg|jpeg|gif|webp|avif|ico|wasm)$ {
        expires 7d;
        add_header Cache-Control "public, max-age=604800, immutable" always;
        try_files $uri =404;
    }

    # Never cache the shell — Flutter renames assets but index.html is
    # the one place that needs to be re-fetched.
    location = /index.html {
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
    }

    # SPA fallback: Flutter pathUrlStrategy needs unknown paths to resolve
    # back to index.html so the client router can take over.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
