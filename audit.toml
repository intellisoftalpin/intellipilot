# cargo-audit configuration
# https://github.com/rustsec/rustsec/tree/main/cargo-audit
#
# Policy: ignores are exceptional. Each one MUST carry a written justification
# that is checked against reality at every dependency bump — an ignore whose
# stated reasoning has quietly stopped being true is worse than no ignore at
# all, because it looks reviewed.

[advisories]
ignore = [
    # RUSTSEC-2023-0071 — `rsa` Marvin timing side-channel.
    #
    # Reachability: the advisory is about RSA *private key* operations
    # (decryption and signing), where a timing side-channel can leak the key.
    # This process holds no RSA private key and performs no private-key
    # operation. `rsa` is reached only through `openidconnect`, which uses it
    # for `RsaPublicKey` signature *verification* of ID tokens and JWKS keys
    # published by the identity provider. Verifying a signature with a public
    # key exposes nothing the provider has not already published.
    #
    # Why the dependency is not simply removed: `rsa` is a mandatory (not
    # feature-gated) dependency of `openidconnect` 4.x, and RS256 is the
    # default ID-token signing algorithm of every mainstream provider,
    # Authentik included. The alternative is to hand-roll OIDC discovery and
    # ID-token verification, which trades an unreachable timing attack for the
    # class of bug that OIDC integrations actually get wrong.
    #
    # A second, separate path exists: `ssh-key`'s optional `rsa` feature, which
    # we do NOT enable — that copy is never compiled. cargo-audit reports it
    # anyway because it scans Cargo.lock without feature resolution.
    #
    # No fixed `rsa` release exists. Re-evaluate when one ships, or when
    # `openidconnect` gains a pluggable RSA backend.
    # Upstream: https://github.com/RustCrypto/RSA/issues/19
    "RUSTSEC-2023-0071",

    # RUSTSEC-2026-0387 — `crypto-bigint` 0.5 timing variability in
    # operations meant to be constant-time.
    #
    # Reachability: `crypto-bigint` 0.5 is reached only through `openidconnect`
    # 4.0.1, via `p256`/`p384` (`elliptic-curve` 0.13), which it uses for
    # ES256/ES384 signature *verification* of ID tokens against the identity
    # provider's published public keys. Every input to that verification —
    # public key, signature, signed token — is public, so a timing difference
    # leaks nothing secret. This process holds no EC private key and performs
    # no EC signing or key agreement through these crates.
    #
    # Why the dependency is not simply upgraded: the fix is `crypto-bigint`
    # 0.7.6, which needs the `elliptic-curve` 0.14 line; `openidconnect` 4.0.1
    # is its latest release and still pins `p256`/`p384` 0.13.
    #
    # Re-evaluate when `openidconnect` moves to `elliptic-curve` 0.14.
    "RUSTSEC-2026-0387",
]
